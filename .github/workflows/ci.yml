name: Node.js CI

on:
  push:
    branches: [ "main", "feature/**", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: knec_ci
          POSTGRES_PASSWORD: synthetic-ci-fixture-only
          POSTGRES_DB: knec_disposable_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knec_ci -d knec_disposable_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - name: Configure disposable database fixture
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const url = new URL('postgresql://127.0.0.1:5432/knec_disposable_test_ci');
        url.username = 'knec_ci';
        url.password = 'synthetic-ci-fixture-only';
        fs.appendFileSync(process.env.GITHUB_ENV, `TEST_DATABASE_URL=${url.href}\n`);
        NODE
    - name: Lint JavaScript
      run: npm run lint
    - name: Scan Repository Files for Secrets
      run: npm run scan:secrets
    - name: Validate Knowledge Base Required Fields
      run: npm run validate-kb
    - name: Run Test Suite
      run: npm test
