name: Node.js CI

on:
  push:
    branches: [ "main", "feature/**", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - name: Lint JavaScript
      run: npm run lint
    - name: Scan Repository Files for Secrets
      run: npm run scan:secrets
    - name: Validate Knowledge Base Required Fields
      run: npm run validate-kb
    - name: Run Test Suite
      run: npm test
